# Refresh GitHub stats + top-languages SVGs into ./assets.
# Official github-readme-stats.vercel.app is often DEPLOYMENT_PAUSED.
name: Refresh GitHub stats cards

on:
  schedule:
    - cron: "30 0 * * *" # daily 00:30 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats-cards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=musavirchukkan&show_icons=true&theme=default&hide_border=true&include_all_commits=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=musavirchukkan&show_icons=true&theme=dark&hide_border=true&include_all_commits=true
          path: assets/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=musavirchukkan&layout=compact&theme=default&hide_border=true&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=musavirchukkan&layout=compact&theme=dark&hide_border=true&langs_count=8
          path: assets/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download streak cards
        run: |
          curl -fsSL "https://streak-stats.demolab.com/?user=musavirchukkan&theme=default&hide_border=true" \
            -o assets/github-streak.svg
          curl -fsSL "https://streak-stats.demolab.com/?user=musavirchukkan&theme=dark&hide_border=true" \
            -o assets/github-streak-dark.svg

      - name: Commit & push assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub stats and streak cards"
          file_pattern: |
            assets/github-stats*.svg
            assets/top-langs*.svg
            assets/github-streak*.svg
